# 🔄 Keeps the README from going stale.
# Rewrites the "latest repos" table + the "last refreshed" timestamp, then commits.

name: Update README

on:
  schedule:
    - cron: "0 3 * * *"        # daily at 03:00 UTC
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - "README.md"

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update README blocks
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/update_readme.py

      - name: Commit changes
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --staged --quiet || git commit -m "chore: auto-refresh README"
          git push
